name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify regression policy probes
        run: npm run quality:test

      - name: Measure unit coverage and function complexity
        run: npm run quality:baseline

      - name: Enforce incremental regression policy
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          if ($env:POLICY_BASE -and $env:POLICY_BASE -notmatch '^0+$') {
            npm run quality:regression -- --base $env:POLICY_BASE
          } else {
            npm run quality:regression
          }

      - name: Retain regression policy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-policy-${{ github.sha }}
          path: reports/quality/
          retention-days: 30

      - name: Verify startup benchmark comparisons
        run: npm run test:startup-benchmark

      - name: Check architecture dependency boundaries
        run: npm run quality:architecture

      - name: Verify architecture gate detects regressions
        run: npm run quality:architecture:test

      - name: Retain architecture dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: architecture-${{ github.sha }}
          path: reports/architecture/dependencies.json
          retention-days: 30

      - name: Run unit, UI, and worker suite
        run: npm run test:all

      - name: Run self-contained Electron viewer regression suite
        run: npm run test:viewer

      - name: Retain viewer captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: viewer-${{ github.sha }}
          path: |
            .dist/jsmol-verification/
            reports/viewer/
          include-hidden-files: true
          retention-days: 30

      - name: Check unused code and dependencies
        run: npm run quality:unused

      - name: Verify unused-code gate detects regressions
        run: npm run quality:unused:test
