name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check architecture dependency boundaries
        run: npm run quality:architecture

      - name: Verify architecture gate detects regressions
        run: npm run quality:architecture:test

      - name: Retain architecture dependency report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: architecture-${{ github.sha }}
          path: reports/architecture/dependencies.json
          retention-days: 30

      - name: Run complete test suite
        run: npm run test:all

      - name: Check unused code and dependencies
        run: npm run quality:unused

      - name: Verify unused-code gate detects regressions
        run: npm run quality:unused:test
