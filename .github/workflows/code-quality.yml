name: Code-quality baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Advisory quality report
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify report tooling
        run: npm run quality:test
      - name: Collect measurements
        run: npm run quality:baseline
      - name: Enforce incremental coverage, complexity and duplication policy
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          if ($env:POLICY_BASE -and $env:POLICY_BASE -notmatch '^0+$') {
            npm run quality:regression -- --base $env:POLICY_BASE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run quality:duplication -- --base $env:POLICY_BASE
          } else {
            npm run quality:regression
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run quality:duplication
          }
      - name: Upload reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-${{ github.sha }}
          path: reports/quality/
          if-no-files-found: warn
          retention-days: 30
