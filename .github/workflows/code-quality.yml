name: Code-quality baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Advisory quality report
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify report tooling
        run: npm run quality:test
      - name: Collect baseline (no score thresholds)
        run: npm run quality:baseline
      - name: Upload reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-${{ github.sha }}
          path: reports/quality/
          if-no-files-found: warn
          retention-days: 30
