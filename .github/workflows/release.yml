name: Release Windows application

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/*packaged*'
      - 'scripts/*release-validation*'
      - 'scripts/*launcher*'
      - 'scripts/*distribution*'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release (for example, v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Test and package Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.revision.outputs.commit }}
      artifact: cif-crystal-data-${{ steps.release.outputs.version || github.sha }}-windows

    env:
      CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package version
        if: github.event_name != 'pull_request'
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' must use semantic version syntax such as v1.2.3 or v1.2.3-beta.1."
          }

          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag '$tag' does not exist. Create and push the tag before running this workflow."
          }

          $tagCommit = (git rev-list -n 1 $tag).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out commit $headCommit does not match tag '$tag' at $tagCommit."
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $Matches.version) {
            throw "Tag version '$($Matches.version)' does not match package.json version '$packageVersion'."
          }
          # package-lock.json has a valid empty-string key under "packages" for the root package.
          # PowerShell object mode rejects that key, so parse as a hashtable instead.
          $lockVersion = (Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['version']
          if ($lockVersion -ne $packageVersion) {
            throw "package-lock.json version '$lockVersion' does not match package.json version '$packageVersion'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($packageVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Record tested revision
        id: revision
        shell: pwsh
        run: '"commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Install dependencies
        run: npm ci

      - name: Verify release gate failure handling
        run: npm run test:release-validation

      - name: Run unit tests
        run: npm test

      - name: Run Electron UI tests
        run: npm run test:ui

      - name: Build production bundles once
        run: npm run build

      - name: Verify production import worker
        run: npx --no-install electron scripts/import-worker-smoke-electron.cjs

      - name: Verify viewer on the release revision
        run: node scripts/run-jsmol-viewer-test.mjs

      - name: Package Windows installers
        run: npx --no-install electron-builder --publish never

      - name: Validate packaged workflows
        run: npm run test:packaged

      - name: Validate portable launcher
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm run test:portable-launcher -- "release/CIF Crystal Data $version.exe"

      - name: Build a newer-version upgrade fixture
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $version = [version]((Get-Content package.json -Raw | ConvertFrom-Json).version.Split('-')[0])
          $probeVersion = "$($version.Major).$($version.Minor).$($version.Build + 1)-upgrade-probe"
          "UPGRADE_PROBE_VERSION=$probeVersion" >> $env:GITHUB_ENV
          npx --no-install electron-builder --win nsis --publish never "--config.extraMetadata.version=$probeVersion" --config.directories.output=release/upgrade-probe

      - name: Validate installer lifecycle on disposable Windows
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'CIF.Crystal.Data.Setup.1.1.0.exe'
          Invoke-WebRequest 'https://github.com/ogundimo/cif-crystal-data/releases/download/v1.1.0/CIF.Crystal.Data.Setup.1.1.0.exe' -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '13c1651071c13e43d60feda5d6a8ffb3901d0e1454e4eb0c31ab5ccadaed3e2b') {
            throw 'Previous installer does not match the pinned release digest.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm run test:installer-distribution -- "release/CIF Crystal Data Setup $version.exe" "release/upgrade-probe/CIF Crystal Data Setup $env:UPGRADE_PROBE_VERSION.exe" $previous

      - name: Retain release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-validation-${{ github.sha }}
          path: |
            reports/release-validation/
            reports/viewer/
            .dist/jsmol-verification/
          include-hidden-files: true
          retention-days: 30

      - name: Verify Windows signatures
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release -File -Filter '*.exe')
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature on $($executable.Name): $($signature.StatusMessage)"
            }
          }

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: npm sbom --sbom-format cyclonedx | Out-File -Encoding utf8 release/sbom.cdx.json

      - name: Generate checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -File -Filter '*.exe' | Sort-Object Name)
          if ($installers.Count -lt 2) {
            throw "Expected both NSIS and portable executables, but found $($installers.Count)."
          }

          $checksums = $installers | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Retain packaged assets
        uses: actions/upload-artifact@v6
        with:
          name: cif-crystal-data-${{ steps.release.outputs.version || github.sha }}-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish validated Windows release
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out validated release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Verify tag still identifies the tested revision
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TESTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:TESTED_COMMIT) { throw 'Release tag changed after validation.' }

      - name: Download validated assets
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: release

      - name: Attest installers and SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: release/*.exe
          sbom-path: release/sbom.cdx.json

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $assets = @(
            Get-ChildItem release -File |
              Where-Object { $_.Extension -eq '.exe' -or $_.Name -in @('SHA256SUMS.txt', 'sbom.cdx.json') } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -lt 4) {
            throw "Release asset list is incomplete: $($assets -join ', ')"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG
            ) + $assets + @(
              '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag',
              '--notes-file', 'RELEASE_NOTES.md',
              '--title', "CIF Crystal Data $env:RELEASE_VERSION"
            )
            if ($env:IS_PRERELEASE -eq 'true') {
              $arguments += '--prerelease'
            }
            gh @arguments
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed with exit code $LASTEXITCODE."
          }
