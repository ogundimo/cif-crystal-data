name: Targeted mutation testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run targeted mutation pilot (no score gate)
        run: npm run test:mutation
      - name: Retain mutation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
